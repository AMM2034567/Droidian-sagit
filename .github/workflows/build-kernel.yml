name: Build Droidian Kernel for Xiaomi Mi 6 (sagit)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'kernel/**'
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Restore Toolchains
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains
          key: ${{ runner.os }}-toolchain-gcc49-v1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper \
            dpkg-dev \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncurses5 \
            libtinfo5 \
            cpio \
            kmod \
            rsync \
            git \
            curl \
            python3 \
            python2 \
            libelf-dev \
            abootimg \
            ccache

          # Setup python2 symlinks for Android kernel build & packaging scripts
          sudo ln -sf /usr/bin/python2 /usr/bin/python || true
          sudo mkdir -p /opt/android/prebuilts/python/2.7.5/bin
          sudo ln -sf /usr/bin/python2 /opt/android/prebuilts/python/2.7.5/bin/python
          sudo ln -sf /usr/bin/python2 /opt/android/prebuilts/python/2.7.5/bin/python2
          sudo ln -sf /usr/bin/python2 /opt/android/prebuilts/python/2.7.5/bin/python2.7

          # Configure ccache
          mkdir -p "$HOME/.ccache"
          ccache -M 5G

          # Install official AOSP mkbootimg tool (via LineageOS 18.1 python3 script)
          sudo curl -sSL https://raw.githubusercontent.com/LineageOS/android_system_tools_mkbootimg/lineage-18.1/mkbootimg.py -o /usr/local/bin/mkbootimg
          sudo chmod +x /usr/local/bin/mkbootimg

          # Install Droidian halium-generic-initramfs
          curl -sSL "https://staging.repo.droidian.org/pool/main/i/initramfs-tools-halium/linux-initramfs-halium-generic_2025.04.11.0+git20260922124935.a1c2588.droidian_arm64.deb" -o /tmp/initramfs.deb
          sudo dpkg-deb -x /tmp/initramfs.deb /
          sudo mkdir -p /usr/lib/aarch64-linux-gnu/halium-generic-initramfs
          if [ ! -f /usr/lib/aarch64-linux-gnu/halium-generic-initramfs/recovery-initramfs.img-halium-generic ] && [ -f /usr/lib/aarch64-linux-gnu/halium-generic-initramfs/initrd.img-halium-generic ]; then
            sudo cp /usr/lib/aarch64-linux-gnu/halium-generic-initramfs/initrd.img-halium-generic /usr/lib/aarch64-linux-gnu/halium-generic-initramfs/recovery-initramfs.img-halium-generic
          fi

          # Install Droidian linux-packaging-snippets
          sudo rm -rf /usr/share/linux-packaging-snippets
          sudo git clone --depth=1 -b droidian https://github.com/droidian/linux-packaging-snippets.git /usr/share/linux-packaging-snippets
          sudo chmod +x /usr/share/linux-packaging-snippets/*.sh || true

      - name: Setup AOSP GCC 4.9 Toolchains
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/toolchains"
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$HOME/toolchains/aarch64-linux-android-4.9"
          git clone --depth=1 -b lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$HOME/toolchains/arm-linux-androideabi-4.9"

      - name: Configure ccache Wrappers & PATH
        run: |
          mkdir -p "$HOME/ccache_bin"
          ln -sf /usr/bin/ccache "$HOME/ccache_bin/aarch64-linux-android-gcc"
          ln -sf /usr/bin/ccache "$HOME/ccache_bin/aarch64-linux-android-g++"
          ln -sf /usr/bin/ccache "$HOME/ccache_bin/arm-linux-androideabi-gcc"
          ln -sf /usr/bin/ccache "$HOME/ccache_bin/arm-linux-androideabi-g++"

          echo "$HOME/ccache_bin" >> $GITHUB_PATH
          echo "$HOME/toolchains/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH
          echo "$HOME/toolchains/arm-linux-androideabi-4.9/bin" >> $GITHUB_PATH

      - name: Verify Toolchain & ccache
        run: |
          "$HOME/toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc" -v
          ccache -s

      - name: Clone UBports sagit (Halium 9.0) Kernel
        run: |
          git clone --depth=1 -b halium-9.0 https://gitlab.com/ubports/porting/community-ports/android9/xiaomi-mi-6/android_kernel_xiaomi_msm8998.git kernel_source

      - name: Inject Debian Packaging & Droidian Fragments
        run: |
          cd kernel_source
          cp -r ../kernel/debian debian
          mkdir -p droidian
          cp -r ../kernel/fragments/* droidian/

          # Dynamically collect all camera_v2 and sound include paths for Qualcomm CAF drivers
          CAM_INCS=$(find drivers/media/platform/msm/camera_v2 -type d | sed 's|^|-I$(srctree)/|' | tr '\n' ' ')
          SND_INCS=$(find sound/soc/msm -type d | sed 's|^|-I$(srctree)/|' | tr '\n' ' ')
          echo "KBUILD_CFLAGS += $CAM_INCS $SND_INCS -I\$(srctree)/drivers/bluetooth -I\$(srctree)/drivers/gpu/msm" >> Makefile
          echo "export KBUILD_CFLAGS" >> Makefile

          # Fix known Qualcomm CAF angle bracket include paths
          find drivers/bluetooth -name '*.c' -exec sed -i -E 's/<(btfm_slim[^>]*)>/\"\1\"/g' {} +
          find sound/soc/msm -name '*.c' -exec sed -i 's/<device_event.h>/"device_event.h"/g' {} +
          find drivers/media/platform/msm/camera_v2 -name '*.c' -exec sed -i 's/<msm_camera_tz_util.h>/"msm_camera_tz_util.h"/g' {} +

          # Fix Qualcomm local tracepoint header includes (#define TRACE_INCLUDE_PATH .)
          for trace_header in $(find . -name '*.h' -exec grep -l '#define TRACE_INCLUDE_PATH \.' {} +); do
            dir=$(dirname "$trace_header")
            if [ -f "$dir/Makefile" ]; then
              echo "Adding -I\$(src) to $dir/Makefile for $(basename $trace_header)"
              echo "ccflags-y += -I\$(src)" >> "$dir/Makefile"
            fi
          done
          cd ..

      - name: Compile Kernel Packages
        run: |
          cd kernel_source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export DEB_BUILD_OPTIONS="parallel=$(nproc)"

          # Run Debian packaging build (-d overrides target arch check for host cross toolchain)
          dpkg-buildpackage -d -b -uc -us -aarm64 || true
          cd ..

      - name: Prepare Artifacts & Fallback Boot Image Packaging
        run: |
          mkdir -p artifacts
          cp *.deb artifacts/ 2>/dev/null || true
          find kernel_source -name '*.deb' -exec cp {} artifacts/ \; 2>/dev/null || true

          # Check if boot.img was built by debian packaging
          find kernel_source -name 'boot.img' -exec cp {} artifacts/ \; 2>/dev/null || true

          # If boot.img not yet found, extract from generated deb packages
          if [ ! -f artifacts/boot.img ]; then
            for deb in artifacts/linux-bootimage-*.deb; do
              if [ -f "$deb" ]; then
                mkdir -p /tmp/deb_extract
                dpkg-deb -x "$deb" /tmp/deb_extract
                find /tmp/deb_extract -name '*.img' -exec cp {} artifacts/boot.img \;
                rm -rf /tmp/deb_extract
                break
              fi
            done
          fi

          # If boot.img still not found, execute fallback build directly
          if [ ! -f artifacts/boot.img ]; then
            echo "Building boot.img directly via make..."
            cd kernel_source
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- sagit_defconfig
            # Merge Droidian config fragments
            ./scripts/kconfig/merge_config.sh -m .config droidian/*.config || true
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- olddefconfig
            make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- Image.gz-dtb

            # Locate Halium initramfs and apply sagit overlay (cust vendor mount)
            RAMDISK="/usr/lib/aarch64-linux-gnu/halium-generic-initramfs/initrd.img-halium-generic"
            if [ -d debian/initramfs-overlay ] && [ -f "$RAMDISK" ]; then
              mkdir -p /tmp/overlay_rd
              (cd /tmp/overlay_rd && gunzip -c "$RAMDISK" | cpio -i && cp -Rv "$GITHUB_WORKSPACE/kernel/debian/initramfs-overlay"/* . && find . | cpio -o -R 0:0 -H newc | gzip > /tmp/sagit_initrd.gz)
              RAMDISK="/tmp/sagit_initrd.gz"
            elif [ ! -f "$RAMDISK" ]; then
              echo -n | gzip -c > /tmp/empty_ramdisk.gz
              RAMDISK="/tmp/empty_ramdisk.gz"
            fi

            # Package boot.img with sagit offsets
            CMDLINE="androidboot.console=ttyMSM0 androidboot.hardware=qcom msm_rtb.filter=0x37 ehci-hcd.park=3 service_locator.enable=1 swiotlb=2048 loop.max_part=7 console=tty0 droidian.lvm.prefer"
            
            KERNEL_IMG=""
            if [ -f arch/arm64/boot/Image.gz-dtb ]; then
              KERNEL_IMG="arch/arm64/boot/Image.gz-dtb"
            elif [ -f arch/arm64/boot/Image.gz ]; then
              KERNEL_IMG="arch/arm64/boot/Image.gz"
            fi

            if [ -n "$KERNEL_IMG" ]; then
              /usr/local/bin/mkbootimg \
                --kernel "$KERNEL_IMG" \
                --ramdisk "$RAMDISK" \
                --base 0x00000000 \
                --pagesize 4096 \
                --kernel_offset 0x00008000 \
                --ramdisk_offset 0x01000000 \
                --second_offset 0x00f00000 \
                --tags_offset 0x00000100 \
                --cmdline "$CMDLINE" \
                --output ../artifacts/boot.img
            fi
            cd ..
          fi

          # Display ccache stats
          ccache -s || true

          ls -lh artifacts/

      - name: Upload Kernel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-sagit
          path: artifacts/
          if-no-files-found: ignore

      - name: Save Toolchains Cache
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains
          key: ${{ runner.os }}-toolchain-gcc49-v1

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-kernel-ccache-${{ github.sha }}
